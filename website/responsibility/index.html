<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/d3-delaunay@6/dist/d3-delaunay.min.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script src="../core/trackingJsonl.js"></script>
        <script src="../core/matchMeta.js"></script>
        <script src="../core/dataHandling.js"></script>
        <script src="../pitch/canvasHelper.js"></script>
        <script src="../pitch/pitchView.js"></script>
        <script src="../marking/common.js"></script>
        <script src="../marking/orientedKnn.js"></script>
        <script src="../algorithms/delaunay.js"></script>
        <script src="kinematics.js"></script>
        <script src="ballReachability.js"></script>
        <script src="ballContest.js"></script>
        <script src="mutualHelp.js"></script>
        <script src="responsibilityMarking.js"></script>
        <script src="../pitch/drawPlayers.js"></script>
        <script src="drawPitch.js"></script>
        <script src="../core/timeline.js"></script>
        <script src="../core/uiElements.js"></script>

        <link rel="stylesheet" type="text/css" href="../styles.css" />

        <title>Responsibility — Football Tracking</title>
    </head>
    <body>
        <br>
        <div class="text-center p-4">

            <center>

            <noscript>
                <div class="p-4" id="error message">
                    <div class="alert alert-danger align-items-center" role="alert">
                        <h5>This website needs JavaScript enabled</h5>
                    </div>
                </div>
            </noscript>

            <div id="entry_view" style="max-width: 700px;">
                <h3>Responsibility</h3>
                <p class="text-muted"><a href="../index.html">Marking views</a></p>
                <hr>
                <p>Please upload <code>tracking.jsonl</code> and optionally <code>metaData.json</code>, then press Submit.</p>
                <div>
                    <div
                        id="drop_zone"
                        ondrop="dropHandler(event);"
                        ondragover="dragOverHandler(event);">
                        <form action="" onsubmit="return false;">
                            <input type="file" id="fileupload" accept=".jsonl" style="display: none;" onchange="onTrackingFileSelected(event)">
                            <input type="file" id="metaupload" accept=".json,application/json" style="display: none;" onchange="onMetadataFileSelected(event)">

                            <div class="upload-row">
                                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="pickTrackingFile()">Choose tracking</button>
                                <span id="tracking_file_name" class="upload-file-name">No file selected</span>
                            </div>
                            <div class="upload-row">
                                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="pickMetadataFile()">Choose metadata</button>
                                <span id="metadata_file_name" class="upload-file-name">No file selected</span>
                            </div>
                            <button type="button" class="btn btn-primary mb-1" onclick="submitUploads()">Submit</button>
                        </form>
                        <p>or drag files here</p>
                    </div>
                </div>
            </div>

            <div id="data_error_view" style="display: none;">
                <div id="error_div_tracking_data" style="max-width: 700px;">
                    <div class="p-4">
                        <div class="alert alert-danger align-items-center" role="alert">
                            <h5 id="dataErrorMessage">Failed to load tracking data</h5>
                            <div id="dataErrorMessageSecondary"></div>
                        </div>
                    </div>
                </div>
            </div>

            </center>

            <div id="data_loading_view" style="display: none;">
                <h3 id="dataLoadingTitle">Processing...</h3>
                <p id="dataLoadingSubtitle"></p>
                <div class="spinner-border m-5" role="status">
                    <span class="sr-only"></span>
                </div>
            </div>

            <div id="website_view" style="display: none;">
                <p class="text-muted mb-2"><a href="../index.html">Marking views</a></p>
                <h1><div id="title_text">Home vs Away</div></h1>
                <hr>

                <div class="row justify-content-center">
                    <div class="col-12" id="main_div_pitch">

                        <div class="playback-controls row justify-content-center align-items-center mb-3">
                            <div class="col-md-auto p-0">
                                <div class="dropup">
                                    <div class="btn-group">
                                        <button type="button" class="btn btn-primary btn-sm" id="play_pause_btn">
                                            <div id="button_play">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-play-fill" viewBox="0 0 16 16">
                                                    <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393"/>
                                                </svg>
                                            </div>
                                            <div id="button_pause">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-pause" viewBox="0 0 16 16">
                                                    <path d="M6 3.5a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-1 0V4a.5.5 0 0 1 .5-.5m4 0a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-1 0V4a.5.5 0 0 1 .5-.5"/>
                                                </svg>
                                            </div>
                                        </button>
                                        <button class="btn btn-primary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                        </button>
                                        <ul class="dropdown-menu">
                                            <li><a class="dropdown-item" href="javascript:changePlaybackSpeed(0.5)">0.5x</a></li>
                                            <li><a class="dropdown-item" href="javascript:changePlaybackSpeed(1)">1x</a></li>
                                            <li><a class="dropdown-item" href="javascript:changePlaybackSpeed(2)">2x</a></li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                            <div class="col p-0 d-flex" style="max-width: 500px;">
                                <div class="d-flex container align-items-center justify-content-center">
                                    <input type="range" min="0" max="1000" value="0" class="form-range" id="duration_slider">
                                </div>
                            </div>
                            <div class="col-md-auto p-0 d-flex">
                                <div class="d-flex container align-items-center justify-content-center">
                                    <div id="time_label_wrap" class="time-label-wrap">
                                        <span id="time_label_text"></span>
                                        <span class="time-label-divider" aria-hidden="true">·</span>
                                        <span id="video_time_label_text" class="time-label-mp4"></span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="pitches-container">
                            <div class="pitch-panel pitch-panel--single">
                                <div class="pitch-direction" id="pitch_direction_1"></div>
                                <canvas id="canvas1"></canvas>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
        <script>
            configureCanvasLayout({ pitchCount: 1, pitchesPerRow: 1, maxWidth: 900, minWidth: 400, gap: 0 });
            configureUIElements({ enableClipExport: false });
            setupResponsibilityOrientedMarking();
            setupUIElements();
        </script>
    </body>
</html>
